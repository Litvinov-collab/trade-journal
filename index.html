/* =========================================================
   SUPABASE REQUEST
   ========================================================= */

async function supabaseRequest(
  endpoint,
  options = {}
) {
  const headers = {
    apikey: SUPABASE_KEY,
    "Content-Type": "application/json",
    ...options.headers
  };

  if (currentUser?.access_token) {
    headers.Authorization =
      "Bearer " + currentUser.access_token;
  }

  const response = await fetch(
    SUPABASE_URL + endpoint,
    {
      ...options,
      headers
    }
  );

  const text = await response.text();

  let data = null;

  try {
    data = text ? JSON.parse(text) : null;
  } catch {
    data = text;
  }

  if (!response.ok) {
    throw new Error(
      data?.message ||
      data?.error_description ||
      data?.error ||
      text ||
      "Ошибка Supabase"
    );
  }

  return data;
}


/* =========================================================

async function getSession() {
  try {
    const saved =
      localStorage.getItem("tradeJournalSession");

    if (!saved) return null;

    const session = JSON.parse(saved);

    if (
      !session ||
      !session.access_token ||
      !session.user
    ) {
      return null;
    }

    currentUser = session;

    return session;

  } catch (error) {
    console.error(
      "Ошибка загрузки сессии:",
      error
    );

    return null;
  }
}


async function login(email, password) {

async function saveTradeToSupabase(trade) {

  if (!currentUser?.user?.id) {

    throw new Error(
      "Сначала необходимо войти в аккаунт."
    );

  }

  const row = {

    user_id:
      currentUser.user.id,

    date:
      trade.date || null,

    symbol:
      trade.symbol || "BTCUSDT",

    session:
      trade.session || null,

    direction:
      trade.direction || null,

    result:
      trade.result || null,

    pl:
      Number(trade.pl || 0),

    setup:
      trade.setup || "",

    entry_time:
      trade.entryTime || null,

    discipline:
      trade.discipline || "yes",

    comment:
      trade.comment || ""

  };


  const data =
    await supabaseRequest(
      "/rest/v1/trades",
      {
        method: "POST",

        headers: {
          Prefer:
            "return=representation"
        },

        body:
          JSON.stringify(row)
      }
    );

  return Array.isArray(data)
    ? data[0]
    : data;
}

/* =========================================================
   ФОРМАТ
   ========================================================= */

function formatPL(value) {

  value =
    Number(value) || 0;

  return (
    value >= 0 ? "+" : ""
  ) +
  value.toFixed(2) +
  "%";

}


function formatDollar(value) {

  value =
    Number(value) || 0;

  return (
    value >= 0 ? "+" : "-"
  ) +
  "$" +
  Math.abs(value).toFixed(2);

}


function escapeHtml(value) {

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    m => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[m])
  );

}


/* =========================================================
   СТАТИСТИКА
   ========================================================= */

function stats(list) {

  const count =
    list.length;

  const wins =
    list.filter(
      t => t.result === "win"
    ).length;

  const pl =
    list.reduce(
      (s, t) =>
        s + Number(t.pl || 0),
      0
    );

  return {

    count,

    winrate:
      count
        ? Math.round(
            wins / count * 100
          )
        : 0,

    pl

  };

}


/* =========================================================
   ФИЛЬТР
   ========================================================= */

function getFilteredTrades() {

  const from =
    $("filterFrom").value;

  const to =
    $("filterTo").value;

  const session =
    $("filterSession").value;

  const direction =
    $("filterDirection").value;

  const result =
    $("filterResult").value;

  const discipline =
    $("filterDiscipline").value;


  return trades.filter(t => {

    if (
      from &&
      t.date < from
    )
      return false;

    if (
      to &&
      t.date > to
    )
      return false;

    if (
      session !== "all" &&
      t.session !== session
    )
      return false;

    if (
      direction !== "all" &&
      t.direction !== direction
    )
      return false;

    if (
      result !== "all" &&
      t.result !== result
    )
      return false;

    if (
      discipline !== "all" &&
      t.discipline !== discipline
    )
      return false;

    return true;

  });

}

/* =========================================================
   РАСШИРЕННАЯ АНАЛИТИКА
   ========================================================= */

function renderAdvancedAnalytics() {

  const winning =
    trades.filter(
      t => t.result === "win"
    );

  const losing =
    trades.filter(
      t => t.result === "loss"
    );


  const grossProfit =
    winning.reduce(
      (s, t) =>
        s +
        Math.max(
          0,
          Number(t.pl || 0)
        ),
      0
    );


  const grossLoss =
    Math.abs(
      losing.reduce(
        (s, t) =>
          s +
          Math.min(
            0,
            Number(t.pl || 0)
          ),
        0
      )
    );


  let factor = 0;


  if (grossLoss > 0)
    factor =
      grossProfit /
      grossLoss;


  if (
    grossProfit > 0 &&
    grossLoss === 0
  )
    factor = Infinity;


  $("profitFactor").textContent =
    factor === Infinity
      ? "∞"
      : factor.toFixed(2);


  $("ratingPF").textContent =
    factor === Infinity
      ? "∞"
      : factor.toFixed(2);


  const avgTP =
    winning.length
      ? winning.reduce(
          (s, t) =>
            s +
            Number(t.pl || 0),
          0
        ) / winning.length
      : 0;


  const avgSL =
    losing.length
      ? losing.reduce(
          (s, t) =>
            s +
            Number(t.pl || 0),
          0
        ) / losing.length
      : 0;


  $("avgTP").textContent =
    formatPL(avgTP);

  $("avgSL").textContent =
    formatPL(avgSL);

  $("avgWin").textContent =
    formatPL(avgTP);

  $("avgLoss").textContent =
    formatPL(avgSL);


  /* СЕРИИ */

  let currentWin = 0;
  let currentLoss = 0;

  let maxWin = 0;
  let maxLoss = 0;


  for (const t of trades) {

    if (
      t.result === "win"
    ) {

      currentWin++;
      currentLoss = 0;

      maxWin =
        Math.max(
          maxWin,
          currentWin
        );

    }

    else if (
      t.result === "loss"
    ) {

      currentLoss++;
      currentWin = 0;

      maxLoss =
        Math.max(
          maxLoss,
          currentLoss
        );

    }

    else {

      currentWin = 0;
      currentLoss = 0;

    }

  }


  $("maxWinStreak").textContent =
    maxWin;

  $("maxLossStreak").textContent =
    maxLoss;


  let streak = 0;
  let type = "";


  if (trades.length) {

    const last =
      trades[
        trades.length - 1
      ].result;


    if (
      last === "win" ||
      last === "loss"
    ) {

      type = last;

      for (
        let i =
          trades.length - 1;
        i >= 0;
        i--
      ) {

        if (
          trades[i].result === last
        )
          streak++;

        else
          break;

      }

    }

  }


  $("currentStreak").textContent =
    streak;


  $("currentStreakType").textContent =
    type === "win"
      ? "Победы"
      : type === "loss"
        ? "Убытки"
        : "—";


  /* ДНИ */

  const daily = {};


  for (const t of trades) {

    if (!daily[t.date])
      daily[t.date] = 0;

    daily[t.date] +=
      Number(t.pl || 0);

  }


  const days =
    Object.entries(daily);


  if (days.length) {

    let best = days[0];
    let worst = days[0];


    for (const d of days) {

      if (
        d[1] > best[1]
      )
        best = d;

      if (
        d[1] < worst[1]
      )
        worst = d;

    }


    $("bestDay").textContent =
      best[0];

    $("bestDayPL").textContent =
      formatPL(best[1]);


    $("worstDay").textContent =
      worst[0];

    $("worstDayPL").textContent =
      formatPL(worst[1]);

  }

  else {

    $("bestDay").textContent =
      "—";

    $("worstDay").textContent =
      "—";

    $("bestDayPL").textContent =
      "0%";

    $("worstDayPL").textContent =
      "0%";

  }


  /* МЕСЯЦЫ */

  const months = {};


  for (const t of trades) {

    const m =
      t.date
        ? t.date.slice(0, 7)
        : "";

    if (!m)
      continue;


    if (!months[m]) {

      months[m] = {
        count: 0,
        wins: 0,
        pl: 0
      };

    }


    months[m].count++;

    months[m].pl +=
      Number(t.pl || 0);


    if (
      t.result === "win"
    )
      months[m].wins++;

  }


  let bestMonth = null;


  for (
    const m of
    Object.entries(months)
  ) {

    if (
      !bestMonth ||
      m[1].pl >
        bestMonth[1].pl
    )
      bestMonth = m;

  }


  if (bestMonth) {

    $("bestMonth").textContent =
      bestMonth[0];

    $("bestMonthPL").textContent =
      formatPL(
        bestMonth[1].pl
      );

    $("bestMonthWinrate").textContent =
      Math.round(
        bestMonth[1].wins /
        bestMonth[1].count *
        100
      ) + "%";

    $("bestMonthCount").textContent =
      bestMonth[1].count;

  }

  else {

    $("bestMonth").textContent =
      "—";

    $("bestMonthPL").textContent =
      "0%";

    $("bestMonthWinrate").textContent =
      "0%";

    $("bestMonthCount").textContent =
      "0";

  }


  /* РЕЙТИНГ */

  const count =
    trades.length;

  const wins =
    trades.filter(
      t => t.result === "win"
    ).length;

  const disciplined =
    trades.filter(
      t => t.discipline === "yes"
    ).length;


  const winRate =
    count
      ? wins / count * 100
      : 0;


  const disciplineRate =
    count
      ? disciplined /
        count *
        100
      : 0;


  let pfScore = 0;


  if (
    factor === Infinity
  )
    pfScore = 100;

  else if (
    factor > 0
  )
    pfScore =
      Math.min(
        100,
        factor / 2 * 100
      );


  const rating =
    Math.round(
      Math.min(
        100,
        winRate * .4 +
        disciplineRate * .4 +
        pfScore * .2
      )
    );


  $("rating").textContent =
    rating;

  $("ratingBar").style.width =
    rating + "%";


  $("ratingWinrate").textContent =
    Math.round(winRate) + "%";

  $("ratingDiscipline").textContent =
    Math.round(
      disciplineRate
    ) + "%";


  $("ratingTitle").textContent =
    !count
      ? "Нет данных"
      : rating >= 80
        ? "🔥 Отличная торговля"
        : rating >= 60
          ? "💪 Хороший результат"
          : rating >= 40
            ? "⚠️ Есть что улучшить"
            : "🛑 Нужно пересмотреть торговлю";


  /* РИСК */

  const deposit =
    Number(settings.deposit) ||
    0;

  const risk =
    Number(settings.risk) ||
    0;

  const riskDollar =
    deposit *
    risk /
    100;


  $("riskDisplay").textContent =
    risk.toFixed(2) + "%";

  $("riskDollar").textContent =
    riskDollar.toFixed(2) + "$";

  $("rewardDollar").textContent =
    (riskDollar * 2)
      .toFixed(2) + "$";

}


/* =========================================================
   СЕТАПЫ

  const names = [
    "Liquidity Sweep",
    "BOS",
    "FVG"
  ];


  const data = {};


  names.forEach(n => {

    data[n] = {
      count: 0,
      wins: 0,
      tp: 0,
      sl: 0,
      pl: 0
    };

  });


  let comboTrades = 0;
  let comboWins = 0;
  let comboPL = 0;


  for (const t of trades) {

    const text =
      (
        (t.setup || "") +
        " " +
        (t.comment || "")
      ).toLowerCase();


    const found = [];


    if (
      text.includes(
        "liquidity sweep"
      ) ||
      text.includes(
        "liquidity"
      ) ||
      text.includes(
        "sweep"
      )
    )
      found.push(
        "Liquidity Sweep"
      );


    if (
      text.includes("bos") ||
      text.includes(
        "break of structure"
      )
    )
      found.push("BOS");


    if (
      text.includes("fvg") ||
      text.includes(
        "fair value gap"
      )
    )
      found.push("FVG");


    if (
      found.length >= 2
    ) {

      comboTrades++;

      comboPL +=
        Number(t.pl || 0);

      if (
        t.result === "win"
      )
        comboWins++;

    }


    for (const n of found) {

      data[n].count++;

      data[n].pl +=
        Number(t.pl || 0);


      if (
        t.result === "win"
      ) {

        data[n].wins++;
        data[n].tp++;

      }


      if (
        t.result === "loss"
      )
        data[n].sl++;

    }

  }


  $("setupStats").innerHTML =
    names.map(n => {

      const d =
        data[n];

      const wr =
        d.count
          ? Math.round(
              d.wins /
              d.count *
              100
            )
          : 0;

      const avg =
        d.count
          ? d.pl / d.count
          : 0;


      return `
        <tr>
          <td>
            <strong>${n}</strong>
          </td>

          <td>${d.count}</td>

          <td>${wr}%</td>

          <td>${d.tp}</td>

          <td>${d.sl}</td>

          <td class="${
            d.pl >= 0
              ? "win"
              : "loss"
          }">
            ${formatPL(d.pl)}
          </td>

          <td class="${
            avg >= 0
              ? "win"
              : "loss"
          }">
            ${formatPL(avg)}
          </td>
        </tr>
      `;

    }).join("");


  const available =
    names
      .map(
        n => [n, data[n]]
      )
      .filter(
        x => x[1].count > 0
      );


  if (
    available.length
  ) {

    let best =
      available[0];

    let worst =
      available[0];


    for (
      const x of available
    ) {

      if (
        x[1].pl >
        best[1].pl
      )
        best = x;


      if (
        x[1].pl <
        worst[1].pl
      )
        worst = x;

    }


    $("bestSetup").textContent =
      best[0];

    $("bestSetupPL").textContent =
      formatPL(
        best[1].pl
      );

    $("bestSetupWinrate").textContent =
      Math.round(
        best[1].wins /
        best[1].count *
        100
      ) + "%";


    $("worstSetup").textContent =
      worst[0];

    $("worstSetupPL").textContent =
      formatPL(
        worst[1].pl
      );

    $("worstSetupWinrate").textContent =
      Math.round(
        worst[1].wins /
        worst[1].count *
        100
      ) + "%";

  }


  else {

    $("bestSetup").textContent =
      "—";

    $("bestSetupPL").textContent =
      "0%";

    $("bestSetupWinrate").textContent =
      "0%";


    $("worstSetup").textContent =
      "—";

    $("worstSetupPL").textContent =
      "0%";

    $("worstSetupWinrate").textContent =
      "0%";

  }


  $("comboCount").textContent =
    comboTrades;


  $("comboWinrate").textContent =
    comboTrades
      ? Math.round(
          comboWins /
          comboTrades *
          100
        ) + "%"
      : "0%";


  $("comboPL").textContent =
    formatPL(comboPL);

}


/* =========================================================
   ЧАСЫ
   ========================================================= */

function renderHourAnalytics() {

  const hours = {};


  for (const t of trades) {

    if (!t.entry_time)
      continue;


    const hour =
      String(
        t.entry_time
      ).slice(0, 2);


    if (!hours[hour]) {

      hours[hour] = {
        count: 0,
        wins: 0,
        pl: 0
      };

    }


    hours[hour].count++;

    hours[hour].pl +=
      Number(t.pl || 0);


    if (
      t.result === "win"
    )
      hours[hour].wins++;

  }


  const entries =
    Object.entries(hours)
      .sort(
        (a, b) =>
          a[0].localeCompare(
            b[0]
          )
      );


  $("hourEmpty").style.display =
    entries.length
      ? "none"
      : "block";


  $("hourStats").innerHTML =
    entries.map(
      ([hour, d]) => {

        const wr =
          Math.round(
            d.wins /
            d.count *
            100
          );

        const avg =
          d.pl / d.count;


        return `
          <tr>

            <td>
              <strong>
                ${hour}:00
              </strong>
            </td>

            <td>
              ${d.count}
            </td>

            <td>
              ${wr}%
            </td>

            <td class="${
              d.pl >= 0
                ? "win"
                : "loss"
            }">
              ${formatPL(d.pl)}
            </td>

            <td class="${
              avg >= 0
                ? "win"
                : "loss"
            }">
              ${formatPL(avg)}
            </td>

          </tr>
        `;

      }
    ).join("");

}


/* =========================================================
   МЕСЯЦЫ
   ========================================================= */

function renderMonthly() {

  const months = {};


  for (const t of trades) {

    const m =
      t.date
        ? t.date.slice(0, 7)
        : "";


    if (!m)
      continue;


    if (!months[m]) {

      months[m] = {
        count: 0,
        wins: 0,
        tp: 0,
        sl: 0,
        pl: 0
      };

    }


    months[m].count++;

    months[m].pl +=
      Number(t.pl || 0);


    if (
      t.result === "win"
    ) {

      months[m].wins++;
      months[m].tp++;

    }


    if (
      t.result === "loss"
    )
      months[m].sl++;

  }


  const entries =
    Object.entries(months)
      .sort(
        (a, b) =>
          b[0].localeCompare(
            a[0]
          )
      );


  $("monthlyEmpty").style.display =
    entries.length
      ? "none"
      : "block";


  $("monthlyStats").innerHTML =
    entries.map(
      ([m, d]) => `

        <tr>

          <td>
            ${escapeHtml(m)}
          </td>

          <td>
            ${d.count}
          </td>

          <td>
            ${Math.round(
              d.wins /
              d.count *
              100
            )}%
          </td>

          <td>
            ${d.tp}
          </td>

          <td>
            ${d.sl}
          </td>

          <td class="${
            d.pl >= 0
              ? "win"
              : "loss"
          }">
            ${formatPL(d.pl)}
          </td>

        </tr>

      `
    ).join("");

}


/* =========================================================
   ГРАФИК
   ========================================================= */

function drawCanvas(canvasId) {

  const canvas =
    $(canvasId);

  if (!canvas)
    return;


  const ctx =
    canvas.getContext("2d");

  const W =
    canvas.width;

  const H =
    canvas.height;


  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  let balance =
    Number(settings.deposit) ||
    0;


  const values =
    [balance];


  for (const t of trades) {

    balance *=
      1 +
      Number(t.pl || 0) /
      100;

    values.push(
      balance
    );

  }


  if (
    values.length < 2
  ) {

    ctx.fillStyle =
      "#66778c";

    ctx.font =
      "16px Arial";

    ctx.fillText(
      "Добавь сделки, чтобы увидеть график",
      25,
      40
    );

    return;

  }


  let min =
    Math.min(
      ...values
    );

  let max =
    Math.max(
      ...values
    );


  if (
    min === max
  ) {

    min -= 1;
    max += 1;

  }


  ctx.strokeStyle =
    "#1b2b3c";

  ctx.lineWidth = 1;


  for (
    let i = 1;
    i < 5;
    i++
  ) {

    const y =
      25 +
      i *
      (H - 50) /
      5;


    ctx.beginPath();

    ctx.moveTo(
      25,
      y
    );

    ctx.lineTo(
      W - 25,
      y
    );

    ctx.stroke();

  }


  ctx.beginPath();


  values.forEach(
    (value, i) => {

      const x =
        25 +
        i *
        (W - 50) /
        (values.length - 1);


      const y =
        H -
        25 -
        (value - min) /
        (max - min) *
        (H - 50);


      if (
        i === 0
      )
        ctx.moveTo(
          x,
          y
        );

      else
        ctx.lineTo(
          x,
          y
        );

    }
  );


  ctx.strokeStyle =
    "#60a5fa";

  ctx.lineWidth = 3;

  ctx.stroke();


  ctx.fillStyle =
    "#60a5fa";


  values.forEach(
    (value, i) => {

      const x =
        25 +
        i *
        (W - 50) /
        (values.length - 1);


      const y =
        H -
        25 -
        (value - min) /
        (max - min) *
        (H - 50);


      ctx.beginPath();

      ctx.arc(
        x,
        y,
        4,
        0,
        Math.PI * 2
      );

      ctx.fill();

    }
  );

}


function drawEquity2() {

  drawCanvas(
    "equity2"
  );

}


/* =========================================================
   ОСНОВНОЙ RENDER
   ========================================================= */

function render() {

  const count =
    trades.length;


  const wins =
    trades.filter(
      t => t.result === "win"
    ).length;


  const tp =
    wins;


  const sl =
    trades.filter(
      t => t.result === "loss"
    ).length;


  const be =
    trades.filter(
      t => t.result === "be"
    ).length;


  const disciplined =
    trades.filter(
      t => t.discipline === "yes"
    ).length;


  const totalPL =
    trades.reduce(
      (s, t) =>
        s + Number(t.pl || 0),
      0
    );


  const average =
    count
      ? totalPL / count
      : 0;


  const initial =
    Number(settings.deposit) ||
    0;


  let balance =
    initial;

  let peak =
    initial;

  let maxDD =
    0;

  let bestTrade =
    0;


  const values =
    [balance];


  for (const t of trades) {

    const pl =
      Number(t.pl || 0);


    bestTrade =
      Math.max(
        bestTrade,
        pl
      );


    balance *=
      1 + pl / 100;


    values.push(
      balance
    );


    if (
      balance > peak
    )
      peak = balance;


    if (
      peak > 0
    ) {

      const dd =
        (
          peak -
          balance
        ) /
        peak *
        100;


      maxDD =
        Math.max(
          maxDD,
          dd
        );

    }

  }


  $("count").textContent =
    count;


  $("winrate").textContent =
    count
      ? Math.round(
          wins /
          count *
          100
        ) + "%"
      : "0%";


  $("discipline").textContent =
    count
      ? Math.round(
          disciplined /
          count *
          100
        ) + "%"
      : "0%";


  $("pnl").textContent =
    formatPL(
      totalPL
    );


  $("pnlDollar").textContent =
    formatDollar(
      balance - initial
    );


  $("balance").textContent =
    "$" +
    balance.toFixed(2);


  $("avg").textContent =
    formatPL(
      average
    );


  $("tpCount").textContent =
    tp;

  $("slCount").textContent =
    sl;

  $("beCount").textContent =
    be;


  $("bestTrade").textContent =
    formatPL(
      bestTrade
    );


  $("drawdown").textContent =
    "-" +
    maxDD.toFixed(2) +
    "%";


  $("riskDrawdown").textContent =
    "-" +
    maxDD.toFixed(2) +
    "%";


  const filtered =
    getFilteredTrades();


  $("empty").style.display =
    filtered.length
      ? "none"
      : "block";


  $("trades").innerHTML =
    filtered
      .slice()
      .reverse()
      .map(
        t => `

          <tr>

            <td>
              ${escapeHtml(t.date)}
            </td>

            <td>
              ${escapeHtml(t.symbol)}
            </td>

            <td>
              ${escapeHtml(t.session)}
            </td>

            <td>
              ${escapeHtml(t.direction)}
            </td>

            <td class="${t.result}">

              <span
                class="badge ${t.result}"
              >

                ${
                  t.result === "win"
                    ? "TP"
                    : t.result === "loss"
                      ? "SL"
                      : "BE"
                }

              </span>

            </td>

            <td class="${
              Number(t.pl || 0) >= 0
                ? "win"
                : "loss"
            }">

              ${
                Number(t.pl || 0) >= 0
                  ? "+"
                  : ""
              }${
                Number(t.pl || 0)
                  .toFixed(2)
              }%

            </td>

            <td>
              ${
                t.discipline === "yes"
                  ? "Да"
                  : "Нет"
              }
            </td>

            <td>
              ${escapeHtml(
                t.comment ||
                t.setup ||
                "—"
              )}
            </td>

          </tr>

        `
      )
      .join("");


  renderAnalytics();
  renderAdvancedAnalytics();
  renderSetupAnalytics();
  renderHourAnalytics();
  renderMonthly();


  if (
    $("chartDeposit")
  )
    $("chartDeposit").textContent =
      "$" +
      initial.toFixed(2);


  if (
    $("chartBalance")
  )
    $("chartBalance").textContent =
      "$" +
      balance.toFixed(2);


  if (
    $("chartPL")
  )
    $("chartPL").textContent =
      formatPL(totalPL);


  if (
    $("chartDD")
  )
    $("chartDD").textContent =
      "-" +
      maxDD.toFixed(2) +
      "%";


  if (
    $("equity")
  )
    drawCanvas(
      "equity"
    );


  if (
    $("equity2")
  )
    drawEquity2();

}

$("tradeForm").onsubmit =
  async e => {

    e.preventDefault();


    if (
      !currentUser?.user?.id
    ) {

      alert(
        "Сначала войдите в аккаунт."
      );

      return;

    }


    const trade = {

      date:
        $("date").value,

      symbol:
        $("symbol")
          .value
          .trim(),

      session:
        $("session").value,

      direction:
        $("direction").value,

      result:
        $("result").value,

      pl:
        Number(
          $("pl").value
        ),

      setup:
        $("setup")
          .value
          .trim(),

      entryTime:
        $("entryTime").value,

      discipline:
        $("disciplineInput")
          .value,

      comment:
        $("comment")
          .value
          .trim()

    };


    try {

      const saved =
        await saveTradeToSupabase(
          trade
        );


      /*
        В Supabase колонка называется
        entry_time, поэтому приводим
        обратно к формату сайта.
      */

      const localTrade = {

        ...saved,

        entryTime:
          saved.entry_time || ""

      };


      trades.push(
        localTrade
      );


      localStorage.setItem(
        TRADES_KEY,
        JSON.stringify(
          trades
        )
      );


      e.target.reset();


      $("date").value =
        new Date()
          .toISOString()
          .slice(0, 10);


      $("symbol").value =
        "BTCUSDT";


      render();


      alert(
        "Сделка сохранена в аккаунт."
      );


      openPage(
        "history"
      );


    } catch (error) {

      console.error(
        "Ошибка сохранения:",
        error
      );


      alert(
        "Не удалось сохранить сделку.\n\n" +
        error.message
      );

    }

  };

/* =========================================================

   ========================================================= */

function exportCSV() {

  const rows = [

    [
      "Дата",
      "Инструмент",
      "Сессия",
      "Направление",
      "Результат",
      "P/L %",
      "Сетап",
      "Время входа",
      "Стратегия",
      "Комментарий"
    ],

    ...getFilteredTrades()
      .map(
        t => [

          t.date,

          t.symbol,

          t.session,

          t.direction,

          t.result,

          t.pl,

          t.setup,

          t.entry_time ||
            t.entryTime ||
            "",

          t.discipline,

          t.comment || ""

        ]
      )

  ];


  const csv =
    "\ufeff" +
    rows
      .map(
        row =>
          row
            .map(
              value =>
                `"${String(
                  value ?? ""
                ).replace(
                  /"/g,
                  '""'
                )}"`
            )
            .join(",")
      )
      .join("\n");


  const link =
    document.createElement(
      "a"
    );


  link.href =
    URL.createObjectURL(
      new Blob(
        [csv],
        {
          type:
            "text/csv;charset=utf-8"
        }
      )
    );


  link.download =
    "trade-journal.csv";


  link.click();

}


$("export").onclick =
  exportCSV;

$("exportSettings").onclick =
  exportCSV;
